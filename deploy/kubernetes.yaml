apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: infrastructure-deployment-planner-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrastructure-deployment-planner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: infrastructure-deployment-planner
  template:
    metadata:
      labels:
        app: infrastructure-deployment-planner
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: infrastructure-deployment-planner:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8120
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8120
          livenessProbe:
            httpGet:
              path: /health
              port: 8120
            initialDelaySeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: infrastructure-deployment-planner-data
---
apiVersion: v1
kind: Service
metadata:
  name: infrastructure-deployment-planner
spec:
  selector:
    app: infrastructure-deployment-planner
  ports:
    - port: 80
      targetPort: 8120
